<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRAGMENT 2.25 // SIMILARITY SCAN</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/terminal.css">
<script src="js/gate.js"></script>
<style>
.meter-wrap { margin-top: 40px; position: relative; z-index: 2; }
.bar {
  height: 4px; background: rgba(57,255,20,0.15); border-radius: 2px;
  overflow: hidden; margin: 20px 0 8px;
}
.bar-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, #39ff14, #7fff8a);
  box-shadow: 0 0 20px rgba(57,255,20,0.8);
  transition: width 0.15s linear;
}
.pct {
  font-size: 48px; color: #39ff14; text-align: center;
  text-shadow: 0 0 30px rgba(57,255,20,0.8);
  font-weight: 700; letter-spacing: 0.05em; margin: 30px 0 20px;
}
.status { font-size: 13px; color: #7a8078; text-align: center; letter-spacing: 0.1em; }
.note { font-size: 13px; color: #ffb84d; text-align: center; margin-top: 30px; letter-spacing: 0.08em; }
</style>
</head>
<body class="terminal-page">
<pre id="terminal"></pre>
<div class="meter-wrap" id="meter" style="display:none;">
  <div class="pct" id="pct">0%</div>
  <div class="bar"><div class="bar-fill" id="fill"></div></div>
  <div class="status" id="status">SCANNING...</div>
  <div class="note" id="note"></div>
</div>
<div id="links" style="display:none; margin-top: 32px; position: relative; z-index: 2;">
  <a href="gap.html">&gt; next: fragment 2.5</a>
</div>
<script>
const lines = [
  { t: "> RUNNING SIMILARITY SCAN", c: "info" },
  { t: "> subject A: NIPA", c: "default" },
  { t: "> subject B: MINHAJ", c: "default" },
  { t: "> method: 22 combined years of pattern matching", c: "dim" },
  { t: "", c: "default" }
];
const term = document.getElementById("terminal");
let i = 0;
function typeLine() {
  if (i >= lines.length) { startMeter(); return; }
  const item = lines[i];
  const span = document.createElement("span");
  span.className = "line-" + item.c;
  term.appendChild(span);
  let j = 0;
  const interval = setInterval(() => {
    if (j < item.t.length) { span.textContent += item.t[j]; j++; }
    else {
      clearInterval(interval);
      term.appendChild(document.createTextNode("\n"));
      i++;
      setTimeout(typeLine, item.t === "" ? 300 : 500);
    }
  }, 20);
}
typeLine();

function startMeter() {
  document.getElementById("meter").style.display = "block";
  const pct = document.getElementById("pct");
  const fill = document.getElementById("fill");
  let v = 0;
  const target = 89;
  const interval = setInterval(() => {
    v += 1;
    if (v > target + 1) {
      // hesitate at 89.4 then drop back
      clearInterval(interval);
      hesitate();
      return;
    }
    pct.textContent = v + "%";
    fill.style.width = v + "%";
  }, 45);
}
function hesitate() {
  const pct = document.getElementById("pct");
  const fill = document.getElementById("fill");
  pct.textContent = "89.4%";
  fill.style.width = "89.4%";
  document.getElementById("status").textContent = "ANOMALY DETECTED";
  setTimeout(() => {
    pct.textContent = "89%";
    fill.style.width = "89%";
    document.getElementById("status").textContent = "STABLE";
    document.getElementById("note").innerHTML = "> the other 11% is unmeasurable. on purpose.";
    setTimeout(() => {
      document.getElementById("links").style.display = "block";
    }, 1200);
  }, 1800);
}
</script>
</body>
</html>
